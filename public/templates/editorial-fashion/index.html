<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{wedding.message}}"><title>{{wedding.couple.one}} &amp; {{wedding.couple.two}}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script><script defer src="script.js"></script></head><body><div id="site"></div><script id="tpl" type="text/x-handlebars-template"><div class="site"><header class="nav"><a class="brand"><a class="brand">ISSUE № 01</a><nav><a href="#story">THE STORY</a><a href="#events">THE EVENT</a><a href="#gallery">THE IMAGES</a></nav></a><nav></nav><a class="nav-cta" href="#rsvp">RSVP</a></header><section class="hero"><div class="editorial-top"><span>THE BIG YES · ISSUE № 01</span><span>{{wedding.date}}</span></div><h1>{{wedding.couple.one}}<span>&amp;</span>{{wedding.couple.two}}</h1><div class="editorial-bottom"><img class="hero-img" src="{{wedding.couple.photo}}" alt="The couple"><p>{{wedding.message}}</p><b>EXPLORE THE ISSUE ↓</b></div></section><main><section class="story" id="story"><p class="eyebrow">A NOTE FROM US</p><h2>{{wedding.story.title}}</h2><p>{{wedding.story.text}}</p><div class="families"><span>{{wedding.families.one}}</span><b>✦</b><span>{{wedding.families.two}}</span></div></section><section class="events" id="events"><div class="section-head"><p class="eyebrow">JOIN US</p><h2>Our celebrations</h2></div><div class="event-list">{{#each wedding.events}}<article class="event-card"><span class="event-index">0{{@index}}</span><div><h3>{{this.name}}</h3><p>{{this.date}} · {{this.time}}</p><p>{{this.location}}</p><p>{{this.description}}</p><a href="{{this.maps}}" target="_blank" rel="noopener">GET DIRECTIONS ↗</a></div></article>{{/each}}</div></section><section class="gallery" id="gallery"><div class="section-head"><p class="eyebrow">THE LITTLE MOMENTS</p><h2>Our photographs</h2></div><div class="gallery-grid">{{#each wedding.gallery}}<figure><img loading="lazy" src="{{this.url}}" alt="{{this.alt}}"><figcaption>{{this.caption}}</figcaption></figure>{{/each}}</div></section><section class="rsvp" id="rsvp"><p class="eyebrow">KINDLY REPLY BY {{wedding.rsvp.deadline}}</p><h2>{{wedding.rsvp.title}}</h2><p>{{wedding.rsvp.message}}</p><a class="nav-cta" href="{{wedding.rsvp.url}}">RESPOND WITH LOVE ↗</a></section></main><footer><p>{{wedding.customMessage}}</p><small>{{wedding.couple.one}} &amp; {{wedding.couple.two}}</small></footer>{{#if wedding.music.url}}<audio id="music" src="{{wedding.music.url}}" loop></audio><button class="music-toggle">♫</button>{{/if}}</div></script></body></html>
